$schema: https://json-schema.org/draft/2020-12/schema
title: SpecGuardian configuration
description: Configuration for SpecGuardian.
type: object
additionalProperties: false
required: [version, fizzbee_files]
properties:
  version:
    description: Version of the configuration format.
    type: string
    const: "0.1"
  fizzbee_files:
    type: array
    minItems: 1
    maxItems: 1
    description: Settings for FizzBee models.
    items:
      $ref: '#/$defs/fizzbeeFile'
  providers:
    type: array
    description: Provider settings.
    items:
      $ref: '#/$defs/provider'
  dev:
    type: boolean
    default: false
    description: Enable development features. Leave disabled for normal use.

$defs:
  compare:
    type: boolean
    default: true
    description: >-
      Whether to compare this state with the application. False also applies
      to all descendants. For collection values, false ignores their contents
      while still comparing map keys or list element counts.

  reason:
    type: string
    description: >-
      Explanation of the comparison choice. Required when compare is false,
      unless an ancestor already has compare=false. Optional in other cases.

  compareOrder:
    type: boolean
    default: true
    description: >-
      Whether element order matters. False compares contents and duplicate
      counts regardless of order. Applies only to this list.

  comparisonEnabled:
    not:
      required: [compare]
      properties:
        compare: {const: false}

  comparisonDisabled:
    required: [compare]
    properties:
      compare: {const: false}

  comparisonReason:
    oneOf:
      - $ref: '#/$defs/comparisonEnabled'
      - allOf:
          - $ref: '#/$defs/comparisonDisabled'
          - required: [reason]
            properties:
              reason:
                type: string
                pattern: '\S'

  fizzbeeFile:
    description: Settings for a FizzBee model.
    type: object
    additionalProperties: false
    required: [output_dir]
    properties:
      output_dir:
        type: string
        minLength: 1
        description: Directory containing model exploration results, relative to this configuration file.
      hooks:
        type: array
        uniqueItems: true
        description: User lifecycle hooks enabled for every action. Omission enables none; provider lifecycle methods always run.
        items:
          type: string
          enum: [setup_case, cleanup_case, setup_attempt, cleanup_attempt]
      roles:
        type: array
        description: Settings for the model's roles.
        items:
          $ref: '#/$defs/role'
      sg_metadata:
        $ref: '#/$defs/sgMetadata'

  sgMetadata:
    description: Comparison settings for metadata produced by Spec Guardian.
    type: object
    additionalProperties: false
    properties:
      action_crashed:
        $ref: '#/$defs/sgActionCrashed'

  sgActionCrashed:
    description: Comparison settings for whether the modeled Action was terminated by a crash.
    type: object
    additionalProperties: false
    properties:
      provider:
        $ref: '#/$defs/fieldProvider'
        description: Result provider for this metadata field. When omitted, supply its value through manual observation.
      compare:
        type: boolean
        description: >-
          Whether to compare modeled Action crashes with the observed crash-equivalent result. When omitted,
          uses the effective FizzBee crash_on_yield option. An explicit value
          overrides that option.

  role:
    description: Settings for a model role.
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
        description: >-
          Role name in the model. The null value is reserved for top-level
          variables; use a string name for a role.
      compare:
        $ref: '#/$defs/compare'
      reason:
        $ref: '#/$defs/reason'
      fields:
        type: array
        description: Settings for the role's fields.
        items:
          $ref: '#/$defs/fieldUnderExcludedAncestor'
    allOf:
      - $ref: '#/$defs/comparisonReason'
      - oneOf:
          - $ref: '#/$defs/comparisonDisabled'
          - allOf:
              - $ref: '#/$defs/comparisonEnabled'
              - properties:
                  fields:
                    items:
                      $ref: '#/$defs/field'

  fieldUnderExcludedAncestor:
    description: Settings for a model field.
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
        description: Field name within the role.
      compare:
        $ref: '#/$defs/compare'
      reason:
        $ref: '#/$defs/reason'
      provider:
        $ref: '#/$defs/fieldProvider'
        description: Provider settings for this field.
      type:
        $ref: '#/$defs/typeUnderExcludedAncestor'
        description: Type of the field's value.

  field:
    description: Settings for a model field.
    allOf:
      - $ref: '#/$defs/fieldUnderExcludedAncestor'
      - $ref: '#/$defs/comparisonReason'
      - oneOf:
          - $ref: '#/$defs/comparisonDisabled'
          - allOf:
              - $ref: '#/$defs/comparisonEnabled'
              - required: [type]
                properties:
                  type:
                    $ref: '#/$defs/valueType'

  typeUnderExcludedAncestor:
    description: Settings for a value type.
    oneOf:
      - $ref: '#/$defs/primitiveType'
      - $ref: '#/$defs/mapType'
      - $ref: '#/$defs/listType'
      - $ref: '#/$defs/messageType'

  primitiveType:
    description: A string, signed 64-bit integer, boolean, double, or byte sequence.
    type: object
    additionalProperties: false
    required: [kind]
    properties:
      kind: {type: string, enum: [string, int64, bool, double, bytes]}
      compare:
        $ref: '#/$defs/compare'
      reason:
        $ref: '#/$defs/reason'
      nullable:
        type: boolean
        default: false
        description: Whether null is an allowed value.

  mapType:
    description: A collection of values identified by string keys.
    type: object
    additionalProperties: false
    required: [kind, values]
    properties:
      kind: {type: string, const: map}
      nullable:
        type: boolean
        default: false
        description: Whether null is an allowed value.
      compare:
        $ref: '#/$defs/compare'
      reason:
        $ref: '#/$defs/reason'
      values:
        $ref: '#/$defs/typeUnderExcludedAncestor'
        description: Type of each map value.

  listType:
    description: A sequence of values.
    type: object
    additionalProperties: false
    required: [kind, values]
    properties:
      kind: {type: string, const: list}
      nullable:
        type: boolean
        default: false
        description: Whether null is an allowed value.
      compare:
        $ref: '#/$defs/compare'
      reason:
        $ref: '#/$defs/reason'
      values:
        $ref: '#/$defs/typeUnderExcludedAncestor'
        description: Type of each list element.
      compare_order:
        $ref: '#/$defs/compareOrder'

  messageType:
    description: A value composed of named fields.
    type: object
    additionalProperties: false
    required: [kind, fields]
    properties:
      kind: {type: string, const: message}
      compare:
        $ref: '#/$defs/compare'
      reason:
        $ref: '#/$defs/reason'
      nullable:
        type: boolean
        default: false
        description: Whether null is an allowed value.
      fields:
        type: object
        description: Type settings for each named field.
        minProperties: 1
        propertyNames:
          minLength: 1
        additionalProperties:
          $ref: '#/$defs/typeUnderExcludedAncestor'

  valueType:
    description: Settings for a value type.
    allOf:
      - $ref: '#/$defs/typeUnderExcludedAncestor'
      - $ref: '#/$defs/comparisonReason'
      - oneOf:
          - $ref: '#/$defs/comparisonDisabled'
          - allOf:
              - $ref: '#/$defs/comparisonEnabled'
              - properties:
                  values:
                    $ref: '#/$defs/valueType'
                  fields:
                    additionalProperties:
                      $ref: '#/$defs/valueType'

  provider:
    description: Settings for a named provider.
    type: object
    additionalProperties: false
    required: [id, source]
    properties:
      id:
        type: string
        minLength: 1
        description: Unique identifier used to reference this provider.
      source:
        $ref: '#/$defs/source'
        description: Source used by this provider.
      config:
        $ref: '#/$defs/sourceConfig'
        description: Settings shared by fields using this provider.

  source:
    description: Implementation and capabilities of a provider.
    type: object
    additionalProperties: false
    properties:
      builtin:
        enum: [sql, valkey, dynamodb, error_as_crashed]
        description: Name of a built-in provider.
      go_package:
        type: string
        minLength: 1
        description: Go import path of an external provider.
      capabilities:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [seed, observe, observe_result]
        not:
          allOf:
            - contains: {const: observe}
            - contains: {const: observe_result}
        description: Interfaces implemented by an external provider. Observe and observe_result are mutually exclusive.
    oneOf:
      - required: [builtin]
        not:
          anyOf:
            - required: [go_package]
            - required: [capabilities]
      - required: [go_package, capabilities]
        not:
          required: [builtin]

  fieldProvider:
    description: Provider settings for a field.
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id:
        type: string
        minLength: 1
        description: Identifier of an provider declared in providers.
      config:
        $ref: '#/$defs/sourceConfig'
        description: Field-specific settings for the selected provider.

  sourceConfig:
    type: [object, 'null']
    additionalProperties: true
    description: Settings defined by the selected source.
