services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: idempotent_request
    ports:
      - "13306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 2s
      retries: 30

  floci:
    image: floci/floci:2.0.1-compat
    ports:
      - "14566:4566"
    volumes:
      - ./dockers/dynamodb:/etc/floci/init/start.d:ro
