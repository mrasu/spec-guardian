version: "0.1"
observers:
  - id: db
    plugin:
      builtin: sql
    config:
      driver: pgx
      connection_string: postgres://postgres@localhost:15432/postgres?sslmode=disable
  - id: cache
    plugin:
      builtin: valkey
    config:
      address: localhost:16379
  - id: error_as_crashed
    kind: result
    plugin:
      builtin: error_as_crashed
fizzbee_files:
  - output_dir: docs/spec/fizzbee_output
    roles:
      - name: Application
        fields:
          - name: read_status
            compare: false
            reason: model execution control only
          - name: write_status
            compare: false
            reason: model execution control only
      - name: DB
        fields:
          - name: records
            observer:
              id: db
              config:
                query: SELECT key, value FROM records
                result:
                  type: kv
                  key_column: key
                  value_column: value
            type:
              kind: map
              values:
                kind: string
          - name: committed_values
            compare: false
            reason: commit history is not stored
      - name: Cache
        fields:
          - name: cached_records
            observer:
              id: cache
              config:
                keys: "*"
            type:
              kind: map
              values:
                kind: string
    sg_metadata:
      action_crashed:
        observer:
          id: error_as_crashed
dev: true
