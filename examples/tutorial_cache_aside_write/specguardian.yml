version: "0.1"
providers:
  - id: db
    source:
      builtin: sql
    config:
      driver: pgx
      connection_string: postgres://postgres@localhost:15432/postgres?sslmode=disable
      tables:
        - name: records
          columns:
            - name: key
              type: string
            - name: value
              type: string
  - id: cache
    source:
      builtin: valkey
    config:
      address: localhost:16379
      keyspaces:
        - name: records
          prefix: "records:"
          data_type: string
  - id: error_as_crashed
    source:
      builtin: error_as_crashed
fizzbee_files:
  - output_dir: docs/spec/fizzbee_output
    hooks: [cleanup_case]
    roles:
      - name: DB
        fields:
          - name: records
            provider:
              id: db
              config:
                table: records
            type:
              kind: list
              compare_order: false
              values:
                kind: message
                fields:
                  key:
                    kind: string
                  value:
                    kind: string
      - name: Cache
        fields:
          - name: cached_records
            provider:
              id: cache
              config:
                keyspace: records
            type:
              kind: map
              values:
                kind: string
    sg_metadata:
      action_crashed:
        provider:
          id: error_as_crashed
dev: true
